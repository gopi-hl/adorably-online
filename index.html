<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adorably.online - UI Design Prompts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Syne', 'sans-serif'],
              mono: ['Space Mono', 'monospace'],
              serif: ['Instrument Serif', 'serif'],
            },
            colors: {
              violet: '#8338ec',
              pink: '#ff006e',
              blue: '#3a86ff',
              cyan: '#00f2fe',
              bg: '#0a0a0b',
            },
            animation: {
              'spin-slow': 'spin 8s linear infinite',
              'blob': 'blob 7s infinite',
              'tilt': 'tilt 10s infinite linear',
              'gradient-rotate': 'gradient-rotate 4s ease infinite',
              'orbit': 'orbit 12s linear infinite',
              'morph': 'morph 8s ease-in-out infinite',
              'blob-drift': 'blob-drift 15s ease-in-out infinite',
              'marquee': 'marquee 15s linear infinite',
              'pulse-glow': 'pulse-glow 1.5s ease-in-out infinite',
              'reveal-word': 'reveal-word 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'shimmer': 'shimmer 2s linear infinite',
              'meteor': 'meteor 5s linear infinite',
              'glitch': 'glitch 1s linear infinite',
              'typewriter': 'typewriter 2s steps(20) infinite alternate, blink .7s infinite',
              'beam': 'beam 2s linear infinite',
              'ripple': 'ripple 1s cubic-bezier(0, 0.2, 0.8, 1) infinite',
              'shine': 'shine 1.5s ease-in-out infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              tilt: {
                '0%, 50%, 100%': { transform: 'rotate(0deg)' },
                '25%': { transform: 'rotate(1deg)' },
                '75%': { transform: 'rotate(-1deg)' },
              },
              'gradient-rotate': {
                '0%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
                '100%': { backgroundPosition: '0% 50%' },
              },
              orbit: {
                '0%': { transform: 'rotate(0deg) translateX(100px) rotate(0deg)' },
                '100%': { transform: 'rotate(360deg) translateX(100px) rotate(0deg)' },
              },
              morph: {
                '0%, 100%': { borderRadius: '60% 40% 30% 70% / 60% 30% 70% 40%' },
                '25%': { borderRadius: '30% 60% 70% 40% / 50% 60% 30% 60%' },
                '50%': { borderRadius: '50% 60% 30% 60% / 30% 60% 70% 40%' },
                '75%': { borderRadius: '60% 40% 60% 30% / 70% 30% 50% 60%' },
              },
              'blob-drift': {
                '0%, 100%': { transform: 'translate(0, 0) scale(1)' },
                '25%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '50%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '75%': { transform: 'translate(50px, 30px) scale(1.05)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              'pulse-glow': {
                '0%, 100%': { boxShadow: '0 0 20px rgba(131, 56, 236, 0.4)' },
                '50%': { boxShadow: '0 0 40px rgba(131, 56, 236, 0.8)' },
              },
              'reveal-word': {
                '0%': { clipPath: 'inset(100% 0 0 0)', opacity: '0', transform: 'translateY(20px)', filter: 'blur(10px)' },
                '100%': { clipPath: 'inset(0 0 0 0)', opacity: '1', transform: 'translateY(0)', filter: 'blur(0)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              meteor: {
                '0%': { transform: 'rotate(215deg) translateX(0)', opacity: '1' },
                '70%': { opacity: '1' },
                '100%': { transform: 'rotate(215deg) translateX(-500px)', opacity: '0' },
              },
              glitch: {
                '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },
                '62%': { transform: 'translate(0,0) skew(5deg)' },
              },
              typewriter: {
                '0%': { width: '0%' },
                '100%': { width: '100%' },
              },
              blink: {
                '0%, 100%': { borderColor: 'transparent' },
                '50%': { borderColor: 'currentColor' },
              },
              beam: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' },
              },
              ripple: {
                '0%': { transform: 'scale(0.8)', opacity: '1' },
                '100%': { transform: 'scale(2.4)', opacity: '0' },
              },
              shine: {
                '0%': { left: '-100%' },
                '100%': { left: '100%' },
              }
            },
          },
        },
      }
    </script>
    <style>
      /* Custom Utilities */
      .preserve-3d { transform-style: preserve-3d; }
      .perspective-1000 { perspective: 1000px; }
      .backface-hidden { backface-visibility: hidden; }
      .rotate-y-180 { transform: rotateY(180deg); }
      
      html { scroll-behavior: smooth; }
      body { background-color: #0a0a0b; transition: background-color 0.3s ease; }
      html:not(.dark) body { background-color: #f8fafc; }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Smooth clip path transitions */
      .transition-clip { transition: clip-path 0.1s linear; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
